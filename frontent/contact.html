<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Washly Go - Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container">
      <h1 class="logo">Washly Go</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="order.html">Order</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <div class="hamburger">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </nav>
    </div>
  </header>

  <!-- Contact Section -->
  <section class="contact">
    <div class="container">
      <h2>Contact Us</h2>
      
      <!-- Contact Form -->
      <form class="booking-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your Name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Your Email" required>

        <label for="message">Message</label>
        <textarea id="message" placeholder="Your Message" rows="5" required></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>

      <!-- Google Map + Get Directions Button -->
      <div class="map" style="margin-top:40px; text-align:center;">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3939.123456789012!2d76.564321!3d10.774321!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba9abcde1234567%3A0x123456789abcdef0!2sOttapalam%2C%20Palakkad%2C%20Kerala%2C%20India!5e0!3m2!1sen!2sin!4v1695980000000!5m2!1sen!2sin"
          width="100%"
          height="300"
          style="border:0; border-radius:10px;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>

        <!-- Get Directions Button -->
        <div style="margin-top:15px;">
         <a href="https://www.google.com/maps/dir/?api=1&destination=Ottapalam,+Palakkad,+Kerala,+India" 
             target="_blank" 
             style="background-color:#FFA500; color:#111; padding:12px 25px; border-radius:8px; text-decoration:none; font-weight:600;">
            Get Directions
         </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2025 Washly Go. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- JS -->
  <script src="js/main.js"></script>
</body>
</html>
